# AeroSpace window manager configuration
# Replaces: Phoenix + Karabiner (Tab-as-Hyper) + Alfred spaces

# Use alt (Option ⌥) as the main modifier (no Karabiner needed)
# Use alt-shift for secondary actions

# Start AeroSpace at login
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# Main keybindings
[mode.main.binding]

# -- Window focus (like Tab + arrow in Phoenix) --
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# -- Move windows within workspace --
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# -- Resize --
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# -- Layout --
alt-space = 'fullscreen'
alt-f = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-v = 'split horizontal'
alt-g = 'split vertical'

# -- Switch to workspace (like Tab + Shift + 1/2/3) --
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# -- Move window to workspace (what Phoenix couldn't do!) --
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# -- Open browser --
alt-b = 'exec-and-forget open -a Firefox'

# -- Show shortcuts help --
alt-shift-slash = '''exec-and-forget osascript -e 'display dialog "AeroSpace Shortcuts\n\nFocus:        alt + h/j/k/l\nMove:         alt+shift + h/j/k/l\nResize:       alt + -/=\nFullscreen:   alt + space\nFloat/Tile:   alt + f\nSplit H/V:    alt + /\n\nWorkspaces:   alt + 1-9\nMove to WS:   alt+shift + 1-9\nLast WS:      alt + tab\nBrowser:      alt + b\n\nService:      alt+shift + ;\nThis help:    alt+shift + /" with title "AeroSpace Help" buttons {"OK"} default button "OK"' '''

# -- Cycle through windows --
alt-tab = 'workspace-back-and-forth'

# -- Service mode (for reload, etc.) --
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['reload-config', 'mode main']
